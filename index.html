<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>互動式課程布告欄 Demo</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="board-screen" class="screen board-screen is-active" aria-label="課程布告欄">
        <div class="cork-board">
          <div class="board-header">
            <h1><img class="board-title-image" src="./content/home/photos/115年度新人訓練.svg" alt="115年度新人訓練" /></h1>
            <img class="board-title-pin" src="./content/home/photos/綠色圖釘.svg" alt="" aria-hidden="true" />
          </div>

          <button class="photo-card photo-review" data-action="review" aria-label="文字魔法變簡報">
            <span class="pin"></span>
            <img src="./content/home/photos/文字魔法變簡報.svg" alt="莉莉亞娜與鯊鯊用魔法將文字變成簡報" />
            <span class="photo-dialog dialog-review-left">大家都很努力學習喔！</span>
            <span class="photo-dialog dialog-review-right">我也是！</span>
            <span class="speech-bubble">文字魔法變簡報</span>
          </button>

          <button class="photo-card photo-outlook" data-action="outlook" aria-label="圖文玩出簡報力">
            <span class="pin"></span>
            <img src="./content/home/photos/圖文玩出簡報力.svg" alt="圖文玩出簡報力" />
            <span class="photo-dialog dialog-review-left">這次換我！</span>
            <span class="photo-dialog dialog-review-right">加油唷！！</span>
            <span class="speech-bubble">圖文玩出簡報力</span>
          </button>

          <button class="photo-card photo-other" data-action="other" aria-label="創意應用分享">
            <span class="pin"></span>
            <img src="./content/home/photos/創意應用分享.svg" alt="創意應用分享" />
            <span class="photo-dialog dialog-review-left">還有很多應用呢！</span>
            <span class="photo-dialog dialog-other-center">啊拉拉拉！</span>
            <span class="speech-bubble">創意應用分享</span>
          </button>
        </div>
      </section>

      <section id="book-screen" class="screen book-screen" aria-label="課程回顧相簿">
        <div class="book-toolbar">
          <button id="back-to-board" class="icon-button" aria-label="回到布告欄" title="回到布告欄">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
          </button>
          <div class="page-status">
            <span id="book-title">文字魔法變簡報</span>
          </div>
          <div class="toolbar-spacer"></div>
        </div>

        <main class="book-stage">
          <div class="album-viewer" aria-live="polite">
            <div class="album-page">
              <iframe id="page-frame" title="課程回顧頁面內容"></iframe>
            </div>
          </div>

        </main>
      </section>

      <div id="blackout" class="blackout" aria-hidden="true"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
