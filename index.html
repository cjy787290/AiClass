<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>互動式課程布告欄 Demo</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="board-screen" class="screen board-screen is-active" aria-label="課程布告欄">
        <div class="cork-board">
          <div class="board-header">
            <h1>TIPC_AI教育訓練回憶錄</h1>
          </div>

          <button class="photo-card photo-review" data-action="review" aria-label="開啟課程回顧">
            <span class="pin"></span>
            <img src="./content/home/photos/課程回顧.svg" alt="課程回顧照片" />
            <span class="photo-dialog dialog-review-left">大家都很努力學習喔！</span>
            <span class="photo-dialog dialog-review-right">我也是！</span>
            <span class="speech-bubble">課程回顧</span>
          </button>

          <button class="photo-card photo-outlook" data-action="outlook" aria-label="課程展望">
            <span class="pin"></span>
            <img src="./content/home/photos/course-outlook.svg" alt="課程展望照片" />
            <span class="speech-bubble">課程展望</span>
          </button>

          <button class="photo-card photo-other" data-action="other" aria-label="其他選項">
            <span class="pin"></span>
            <img src="./content/home/photos/other-options.svg" alt="其他選項照片" />
            <span class="speech-bubble">其他選項</span>
          </button>
        </div>
      </section>

      <section id="book-screen" class="screen book-screen" aria-label="課程回顧相簿">
        <div class="book-toolbar">
          <button id="back-to-board" class="icon-button" aria-label="回到布告欄" title="回到布告欄">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m12 19-7-7 7-7"></path>
              <path d="M19 12H5"></path>
            </svg>
          </button>
          <div class="page-status">
            <span>課程回顧</span>
            <strong id="page-counter">1 / 10</strong>
          </div>
          <div class="toolbar-spacer"></div>
        </div>

        <main class="book-stage">
          <button id="prev-page" class="nav-button" aria-label="上一頁" title="上一頁">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>

          <div class="album-viewer" aria-live="polite">
            <div class="album-page">
              <iframe id="page-frame" title="課程回顧頁面內容"></iframe>
            </div>
          </div>

          <button id="next-page" class="nav-button" aria-label="下一頁" title="下一頁">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </main>
      </section>

      <div id="blackout" class="blackout" aria-hidden="true"></div>
    </div>
    <script src="./src/main.js"></script>
  </body>
</html>
