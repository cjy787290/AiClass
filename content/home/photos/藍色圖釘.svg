<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EDBFF"/>
      <stop offset="0.55" stop-color="#28A8F2"/>
      <stop offset="1" stop-color="#1269A8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EDBFF"/>
      <stop offset="1" stop-color="#1269A8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FF"/>
      <stop offset="0.45" stop-color="#9AA4B8"/>
      <stop offset="1" stop-color="#3F4655"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" stroke="#2A1730" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- metal needle -->
    <path d="M270 330 L230 454" fill="none" stroke="url(#metal)" stroke-width="22"/>
    <path d="M229 454 L218 488 L244 461 Z" fill="#4A4F5B" stroke="#2A1730" stroke-width="8"/>

    <!-- lower collar -->
    <path d="M164 278 C178 320 334 320 348 278 L321 245 H191 Z"
          fill="url(#rim)"/>

    <!-- stem -->
    <path d="M206 188 C204 225 202 252 190 278
             C216 302 296 302 322 278
             C310 252 308 225 306 188 Z"
          fill="url(#cap)"/>

    <!-- cap -->
    <ellipse cx="256" cy="166" rx="112" ry="72" fill="url(#cap)"/>
    <ellipse cx="256" cy="145" rx="78" ry="40" fill="#8EDBFF" opacity="0.72" stroke="none"/>
    <path d="M181 185 C208 210 305 213 333 181"
          fill="none" stroke="#1269A8" stroke-width="12" opacity="0.7"/>

    <!-- highlights -->
    <path d="M188 138 C211 107 256 91 297 105"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="15"/>
    <path d="M222 207 C220 233 218 249 211 265"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10"/>
  </g>
</svg>